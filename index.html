<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduStream - منصة المحتوى الهادف والتعليمي</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #222;
            --card-bg: #fff;
            --nav-bg: #fff;
            --border-color: #dfe3e8;
            --primary: #0066cc;
            --sidebar-width: 250px;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --nav-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --primary: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }

        /* شريط التنقل العلوي */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 65px;
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button, .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        button:hover { opacity: 0.9; }

        .secondary-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        /* التخطيط */
        .main-layout {
            display: flex;
            margin-top: 65px;
        }

        aside {
            width: var(--sidebar-width);
            height: calc(100vh - 65px);
            position: fixed;
            background-color: var(--nav-bg);
            border-left: 1px solid var(--border-color);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .sidebar-item:hover {
            background-color: var(--border-color);
        }

        .content-area {
            margin-right: var(--sidebar-width);
            flex-grow: 1;
            padding: 25px;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
        }

        /* شبكة الفيديوهات */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .video-player-container {
            width: 100%;
            height: 165px;
            background: #000;
        }

        .video-player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        .video-title {
            font-size: 15px;
            font-weight: bold;
            line-height: 1.5;
        }

        .video-actions {
            display: flex;
            gap: 6px;
            margin-top: auto;
        }

        .video-actions button {
            font-size: 12px;
            padding: 5px 10px;
            background: var(--border-color);
            color: var(--text-color);
        }

        /* النوافذ المنبثقة */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid var(--border-color);
        }
        .modal-content input, .modal-content select {
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            aside { display: none; }
            .content-area { margin-right: 0; }
        }
    </style>
</head>
<body data-theme="dark">

    <nav>
        <div class="logo">💡 EduStream</div>
        <div class="nav-controls">
            <button class="btn" onclick="openUploadModal()">➕ نشر محتوى هادف</button>
            <button class="secondary-btn" onclick="toggleTheme()">🌓 المظهر</button>
            <button id="auth-btn" onclick="openAuthModal()">تسجيل الدخول</button>
        </div>
    </nav>

    <div class="main-layout">
        <aside>
            <div class="sidebar-item" onclick="filterVideos('all')">📂 كافة الأقسام</div>
            <div class="sidebar-item" onclick="filterVideos('science')">🔬 العلوم والبحث العلمي</div>
            <div class="sidebar-item" onclick="filterVideos('programming')">💻 البرمجة وتقنية المعلومات</div>
            <div class="sidebar-item" onclick="filterVideos('history')">📜 التاريخ والحضارات</div>
            <div class="sidebar-item" onclick="filterVideos('human')">🧠 التنمية الذاتية وعلم النفس</div>
        </aside>

        <div class="content-area">
            <h2 class="section-title" id="section-heading">مكتبة المعرفة والفيديوهات الهادفة</h2>
            <div class="grid" id="video-grid"></div>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <h3>تسجيل الدخول إلى المنصة</h3>
            <input type="email" placeholder="البريد الإلكتروني">
            <input type="password" placeholder="كلمة المرور">
            <button onclick="loginUser()">تسجيل الدخول</button>
            <button class="secondary-btn" onclick="closeAuthModal()">إلغاء</button>
        </div>
    </div>

    <!-- نافذة نشر فيديو -->
    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <h3>نشر فيديو هادف جديد</h3>
            <input type="text" id="up-title" placeholder="عنوان الفيديو التعليمي/الهادف">
            <input type="text" id="up-url" placeholder="رابط يوتيوب (Embed)">
            <select id="up-category">
                <option value="science">العلوم والبحث العلمي</option>
                <option value="programming">البرمجة وتقنية المعلومات</option>
                <option value="history">التاريخ والحضارات</option>
                <option value="human">التنمية الذاتية وعلم النفس</option>
            </select>
            <button onclick="publishVideo()">نشر الآن</button>
            <button class="secondary-btn" onclick="closeUploadModal()">إلغاء</button>
        </div>
    </div>

    <script>
        let isLoggedIn = false;

        // قاعدة بيانات ضخمة مبدئية تضم فيديوهات هادفة وتعليمية وتاريخية وعلمية (يمكنك تزويدها بمئات العناصر هنا)
        let videos = [
            { id: 1, title: "قصة الكون: كيف نشأ كل شيء من الانفجار العظيم؟", url: "https://www.youtube.com/embed/aircAruvnKk", category: "science" },
            { id: 2, title: "أساسيات لغة البرمجة وتفكير المبرمجين", url: "https://www.youtube.com/embed/zJSY8tbf_ys", category: "programming" },
            { id: 3, title: "تاريخ الحضارات القديمة وأثرها في البشرية", url: "https://www.youtube.com/embed/LXb3EKWsInQ", category: "history" },
            { id: 4, title: "كيف تكتسب عادات جديدة وتتخلص من التسويف؟", url: "https://www.youtube.com/embed/3JZ_D3ELwOQ", category: "human" },
            { id: 5, title: "أسرار العقل البشري وكيف يعمل الوعي واللاوعي", url: "https://www.youtube.com/embed/W6NZfCO5SIk", category: "science" },
            { id: 6, title: "خارطة طريق تعلم الذكاء الاصطناعي من الصفر", url: "https://www.youtube.com/embed/kJQP7kiw5Fk", category: "programming" },
            { id: 7, title: "محطات خالدة في تاريخ العلوم والاختراعات", url: "https://www.youtube.com/embed/2Vv-BfVoq4g", category: "history" },
            { id: 8, title: "مهارات الذكاء العاطفي والتواصل الفعال", url: "https://www.youtube.com/embed/1k8ib097WJc", category: "human" },
            { id: 9, title: "فيزياء الكم مبسطة: كيف تفهم العالم دون الذري؟", url: "https://www.youtube.com/embed/UItWltVZZmE", category: "science" },
            { id: 10, title: "بناء النظم البرمجية الضخمة وقواعد البيانات", url: "https://www.youtube.com/embed/YqeW9_5kURI", category: "programming" }
        ];

        function renderVideos(category = 'all') {
            const grid = document.getElementById("video-grid");
            grid.innerHTML = "";
            const filtered = category === 'all' ? videos : videos.filter(v => v.category === category);

            filtered.forEach(video => {
                const card = document.createElement("div");
                card.className = "video-card";
                card.innerHTML = `
                    <div class="video-player-container">
                        <iframe src="${video.url}" allowfullscreen></iframe>
                    </div>
                    <div class="video-info">
                        <h3 class="video-title">${video.title}</h3>
                        <div class="video-actions">
                            <button onclick="checkAuth('download')">📥 تحميل</button>
                            <button onclick="checkAuth('favorite')">⭐ حفظ</button>
                            <button onclick="shareVideo('${video.title}')">🔗 مشاركة</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterVideos(category) {
            renderVideos(category);
        }

        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute("data-theme");
            const next = current === "dark" ? "light" : "dark";
            body.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        }

        window.onload = () => {
            const saved = localStorage.getItem("theme") || "dark";
            bodyTheme = saved;
            document.body.setAttribute("data-theme", saved);
            renderVideos();
        }

        function checkAuth(action) {
            if (!isLoggedIn) {
                alert("يرجى تسجيل الدخول للاستفادة من هذه الميزة التعليمية!");
                openAuthModal();
            } else {
                if(action === 'download') alert("جاري التحميل...");
                if(action === 'favorite') alert("تمت الإضافة للمفضلة بنجاح!");
            }
        }

        function openAuthModal() { document.getElementById("auth-modal").style.display = "flex"; }
        function closeAuthModal() { document.getElementById("auth-modal").style.display = "none"; }
        function loginUser() {
            isLoggedIn = true;
            document.getElementById("auth-btn").innerText = "حسابي (معتمد)";
            closeAuthModal();
            alert("مرحباً بك! يمكنك الآن نشر ومشاركة المحتوى.");
        }

        function openUploadModal() {
            if(!isLoggedIn) {
                alert("يجب تسجيل الدخول أولاً لتتمكن من النشر!");
                openAuthModal();
                return;
            }
            document.getElementById("upload-modal").style.display = "flex";
        }
        function closeUploadModal() { document.getElementById("upload-modal").style.display = "none"; }

        function publishVideo() {
            const title = document.getElementById("up-title").value;
            let url = document.getElementById("up-url").value;
            const category = document.getElementById("up-category").value;

            if(!title || !url) {
                alert("الرجاء تعبئة الحقول المطلوبة");
                return;
            }
            if(url.includes("watch?v=")) url = url.replace("watch?v=", "embed/");

            videos.unshift({ id: videos.length + 1, title, url, category });
            renderVideos();
            closeUploadModal();
            alert("تم نشر المحتوى الهادف بنجاح!");
            document.getElementById("up-title").value = "";
            document.getElementById("up-url").value = "";
        }

        function shareVideo(title) {
            navigator.clipboard.writeText(window.location.href);
            alert(`تم نسخ رابط المحتوى: (${title})`);
        }
    </script>
</body>
</html>

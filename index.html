<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عصام صاصا - Sasa Vibes</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #121212;
            --header-bg: #181818;
            --text-color: #e0e0e0;
            --secondary-text: #999;
            --card-bg: #1a1a1a;
            --card-hover: #222;
            --border-color: #282828;
            --accent-color: #f39c12;
            --accent-hover: #e67e22;
            --player-bg: #161616;
        }

        [data-theme="light"] {
            --bg-color: #f4f4f4;
            --header-bg: #ffffff;
            --text-color: #222222;
            --secondary-text: #666;
            --card-bg: #ffffff;
            --card-hover: #eaeaea;
            --border-color: #dddddd;
            --accent-color: #d35400;
            --accent-hover: #e67e22;
            --player-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 130px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: var(--secondary-text);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: var(--accent-color);
        }

        .theme-toggle-btn {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* الهيرو مع خلفية تتغير بصورة صاصا */
        .hero {
            height: 55vh;
            background: linear-gradient(rgba(18,18,18,0.85), rgba(18,18,18,0.95)), url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1200&q=80') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .hero-content h1 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 12px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero-content p {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 25px;
            max-width: 600px;
        }

        .btn-play {
            background-color: var(--accent-color);
            color: #fff;
            padding: 12px 28px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
        }

        .tracks-section {
            padding: 40px 8%;
        }

        .tracks-section h2 {
            font-size: 24px;
            margin-bottom: 25px;
            border-right: 4px solid var(--accent-color);
            padding-right: 12px;
        }

        .tracks-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .track-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }

        .track-card:hover {
            background-color: var(--card-hover);
            border-color: var(--accent-color);
        }

        .track-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
        }

        .track-img {
            width: 45px;
            height: 45px;
            background-color: var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .track-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .track-info p {
            font-size: 13px;
            color: var(--secondary-text);
        }

        .track-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-icon {
            background: none;
            border: none;
            color: var(--secondary-text);
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-icon:hover {
            color: var(--accent-color);
        }

        .action-icon.favorited {
            color: #e74c3c;
        }

        /* مشغل سبوتيفاي السفلي المتقدم */
        .audio-player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--player-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px 8%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .player-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-track-details {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .current-track-img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            overflow: hidden;
        }

        .current-track-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .current-track-info span {
            display: block;
            font-weight: 700;
            font-size: 15px;
        }

        .current-track-info small {
            color: var(--secondary-text);
            font-size: 13px;
        }

        .player-controls-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 40%;
        }

        .controls-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .controls-buttons button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
        }

        .controls-buttons .play-pause-main {
            background-color: var(--accent-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* شريط التوقيت والزمن */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            font-size: 12px;
            color: var(--secondary-text);
        }

        .progress-bar {
            flex-grow: 1;
            height: 5px;
            background-color: var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }

        .progress-filled {
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 5px;
            width: 0%;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-headphones"></i> Sasa <span>Vibes</span>
        </div>
        <div class="nav-links">
            <nav>
                <a onclick="filterSongs('all')" class="active" id="navAll">الرئيسية</a>
                <a onclick="filterSongs('favorites')" id="navFav">المفضلة ❤️</a>
            </nav>
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="تغيير الوضع">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <section class="hero" id="heroSection">
        <div class="hero-content">
            <h1>عصام صاصا</h1>
            <p>أكبر أرشيف لمهرجانات كينج المهرجانات. استمع، أضف للمفضلة، وشارك أغانيك المفضلة.</p>
            <a href="#tracks" class="btn-play"><i class="fa-solid fa-play"></i> استمع الآن</a>
        </div>
    </section>

    <section class="tracks-section" id="tracks">
        <h2 id="sectionTitle">كل المهرجانات</h2>
        <div class="tracks-container" id="tracksList"></div>
    </section>

    <!-- مشغل موسيقى احترافي مثل سبوتيفاي -->
    <div class="audio-player-bar">
        <div class="player-main">
            <div class="current-track-details">
                <div class="current-track-img">
                    <img id="currentImg" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=200&q=80" alt="">
                </div>
                <div class="current-track-info">
                    <span id="trackTitle">اختر مهرجاناً للاستماع</span>
                    <small id="trackArtist">عصام صاصا</small>
                </div>
            </div>

            <div class="player-controls-center">
                <div class="controls-buttons">
                    <button onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="play-pause-main" onclick="togglePlay()"><i class="fa-solid fa-play" id="playPauseIcon"></i></button>
                    <button onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="progress-container">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar" onclick="setProgress(event)">
                        <div class="progress-filled" id="progressFilled"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <div></div> <!-- لتوسيع التوازن في الفليكس -->
        </div>
        <audio id="audioElement"></audio>
    </div>

    <script>

            { title: "مهرجان صاحبي الكويسة", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان شد حيلك يا عريس", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان يا بخته اللي زعلني", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان عيني على اللي باعوني", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", img: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان لبانة وشوية سكر", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان وسط الدموع", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان سجن العذاب", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان اخويا اللي بعتني", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3", img: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان صحبة الوجع", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان ناس مش تمام", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان عود البطل المحظوظ", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان طريق الشقايا", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3", img: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=300&q=80" },

            { title: "مهرجان انا السنداب", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=300&q=80" },

            { title: "مهرجان جرح الطعنات", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان كلو هلس في هلس", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان ضاع العمر يا صاصا", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3", img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان سكة التعبان", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3", img: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان حبة تدليس", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3", img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=300&q=80" },
            { title: "مهرجان الختام الساقع", artist: "عصام صاصا", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3", img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=300&q=80" }
        ];

        let favorites = JSON.parse(localStorage.getItem("sasa_favs")) || [];
        let currentIndex = 0;
        let currentFilter = 'all';

        let audioElement = document.getElementById("audioElement");
        let trackTitle = document.getElementById("trackTitle");
        let trackArtist = document.getElementById("trackArtist");
        let currentImg = document.getElementById("currentImg");
        let playPauseIcon = document.getElementById("playPauseIcon");
        let heroSection = document.getElementById("heroSection");
        
        let currentTimeEl = document.getElementById("currentTime");
        let durationEl = document.getElementById("duration");
        let progressFilled = document.getElementById("progressFilled");
        let progressBar = document.getElementById("progressBar");

        function renderSongs(list) {
            const container = document.getElementById("tracksList");
            container.innerHTML = "";

            if(list.length === 0) {
                container.innerHTML = `<p style="color:var(--secondary-text)">لا توجد أغاني في المفضلة حالياً.</p>`;
                return;
            }

            list.forEach((song, index) => {
                let isFav = favorites.includes(song.title);
                container.innerHTML += `
                    <div class="track-card">
                        <div class="track-left" onclick="playSongByIndex(${songs.indexOf(song)})">
                            <div class="track-img"><img src="${song.img}" alt=""></div>
                            <div class="track-info">
                                <h3>${index + 1}. ${song.title}</h3>
                                <p>${song.artist}</p>
                            </div>
                        </div>
                        <div class="track-actions">
                            <button class="action-icon ${isFav ? 'favorited' : ''}" onclick="toggleFavorite('${song.title}')">
                                <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i>
                            </button>
                            <button class="action-icon" onclick="shareSong('${song.title}')">
                                <i class="fa-solid fa-share-nodes"></i>
                            </button>
                            <button class="action-icon" onclick="playSongByIndex(${songs.indexOf(song)})">
                                <i class="fa-solid fa-play"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function playSongByIndex(index) {
            currentIndex = index;
            let song = songs[currentIndex];
            
            trackTitle.innerText = song.title;
            trackArtist.innerText = song.artist;
            currentImg.src = song.img;
            audioElement.src = song.url;
            
            // تغيير خلفية الهيرو بصورة عصام صاصا الخاصة بالأغنية
            heroSection.style.background = `linear-gradient(rgba(18,18,18,0.85), rgba(18,18,18,0.95)), url('${song.img}') center/cover`;

            audioElement.play();
            playPauseIcon.className = "fa-solid fa-pause";
        }

        function togglePlay() {
            if (!audioElement.src) {
                playSongByIndex(0);
                return;
            }
            if (audioElement.paused) {
                audioElement.play();
                playPauseIcon.className = "fa-solid fa-pause";
            } else {
                audioElement.pause();
                playPauseIcon.className = "fa-solid fa-play";
            }
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % songs.length;
            playSongByIndex(currentIndex);
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            playSongByIndex(currentIndex);
        }

        function toggleFavorite(title) {
            if (favorites.includes(title)) {
                favorites = favorites.filter(t => t !== title);
            } else {
                favorites.push(title);
            }
            localStorage.setItem("sasa_favs", JSON.stringify(favorites));
            filterSongs(currentFilter);
        }

        function shareSong(title) {
            if (navigator.share) {
                navigator.share({
                    title: 'عصام صاصا - Sasa Vibes',
                    text: `استمع إلى مهرجان "${title}" عبر موقع عصام صاصا`,
                    url: window.location.href,
                }).catch(() => {});
            } else {
                alert(`تم نسخ رابط الأغنية: ${title}`);
            }
        }

        function filterSongs(type) {
            currentFilter = type;
            document.getElementById("navAll").classList.remove("active");
            document.getElementById("navFav").classList.remove("active");

            if (type === 'all') {
                document.getElementById("navAll").classList.add("active");
                document.getElementById("sectionTitle").innerText = "كل المهرجانات";
                renderSongs(songs);
            } else {
                document.getElementById("navFav").classList.add("active");
                document.getElementById("sectionTitle").innerText = "الأغاني المفضلة ❤️";
                let favSongs = songs.filter(s => favorites.includes(s.title));
                renderSongs(favSongs);
            }
        }

        // تحديث شريط الزمن والوقت الحقيقي
        audioElement.addEventListener("timeupdate", () => {
            if (audioElement.duration) {
                let progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                progressFilled.style.width = progressPercent + "%";
                
                currentTimeEl.innerText = formatTime(audioElement.currentTime);
                durationEl.innerText = formatTime(audioElement.duration);
            }
        });

        audioElement.addEventListener("ended", () => {
            nextSong();
        });

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function setProgress(e) {
            let width = progressBar.clientWidth;
            let clickX = e.offsetX;
            let duration = audioElement.duration;
            if(duration) {
                audioElement.currentTime = (clickX / width) * duration;
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById("themeIcon");
            if (html.getAttribute("data-theme") === "light") {
                html.removeAttribute("data-theme");
                themeIcon.className = "fa-solid fa-moon";
            } else {
                html.setAttribute("data-theme", "light");
                themeIcon.className = "fa-solid fa-sun";
            }
        }

        // بدء التشغيل بعرض كل الأغاني
        renderSongs(songs);
    </script>
</body>
</html>

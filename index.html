<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVerse - منصة الفيديوهات</title>
    <style>
        :root {
            --bg-color: #f9f9f9;
            --text-color: #111;
            --card-bg: #fff;
            --nav-bg: #fff;
            --border-color: #ddd;
            --primary: #cc0000;
        }

        [data-theme="dark"] {
            --bg-color: #0f0f0f;
            --text-color: #f1f1f1;
            --card-bg: #212121;
            --nav-bg: #212121;
            --border-color: #383838;
            --primary: #ff4e45;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding-top: 70px;
            transition: background 0.3s, color 0.3s;
        }

        /* شريط التنقل العلوي */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
        }

        .nav-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button, .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .theme-toggle {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        /* شبكة عرض الفيديوهات */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-thumbnail {
            width: 100%;
            height: 160px;
            background-color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
        }

        .video-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .video-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0;
        }

        .video-actions {
            display: flex;
            gap: 5px;
            margin-top: auto;
        }

        .video-actions button {
            font-size: 12px;
            padding: 5px 8px;
            background: var(--border-color);
            color: var(--text-color);
        }

        /* نافذة تسجيل الدخول الوهمية */
        #auth-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content input {
            padding: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 4px;
        }
    </style>
</head>
<body data-theme="dark">

    <!-- شريط التنقل -->
    <nav>
        <div class="logo">StreamVerse 🎬</div>
        <div class="nav-controls">
            <button class="theme-toggle" onclick="toggleTheme()">الوضع الليلي / النهاري</button>
            <button id="auth-btn" onclick="openLogin()">تسجيل الدخول</button>
        </div>
    </nav>

    <!-- المحتوى الرئيسي (الفيديوهات) -->
    <div class="container">
        <h2>أحدث الفيديوهات</h2>
        <div class="grid">
            <!-- فيديو 1 -->
            <div class="video-card">
                <div class="video-thumbnail">معاينة الفيديو 1</div>
                <div class="video-info">
                    <h3 class="video-title">شرح برمجة وتصميم واجهة شبيهة بيوتيوب</h3>
                    <div class="video-actions">
                        <button onclick="checkAuth('download')">تنزيل</button>
                        <button onclick="checkAuth('favorite')">المفضلة</button>
                        <button onclick="shareVideo()">مشاركة</button>
                    </div>
                </div>
            </div>
            <!-- فيديو 2 -->
            <div class="video-card">
                <div class="video-thumbnail">معاينة الفيديو 2</div>
                <div class="video-info">
                    <h3 class="video-title">أفضل ممارسات تطوير الويب الحديثة 2026</h3>
                    <div class="video-actions">
                        <button onclick="checkAuth('download')">تنزيل</button>
                        <button onclick="checkAuth('favorite')">المفضلة</button>
                        <button onclick="shareVideo()">مشاركة</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول -->
    <div id="auth-modal">
        <div class="modal-content">
            <h3>تسجيل الدخول إلزامي</h3>
            <input type="email" placeholder="البريد الإلكتروني">
            <input type="password" placeholder="كلمة المرور">
            <button onclick="loginUser()">دخول</button>
            <button style="background:transparent; color:var(--text-color)" onclick="closeLogin()">إلغاء</button>
        </div>
    </div>

    <script>
        let isLoggedIn = false;

        // تبديل الوضع الليلي
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            body.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
        }

        // استرجاع الثيم المحفوظ
        window.onload = () => {
            const savedTheme = localStorage.getItem("theme") || "dark";
            document.body.setAttribute("data-theme", savedTheme);
        }

        // التحقق من تسجيل الدخول قبل التفاعل
        function checkAuth(actionType) {
            if (!isLoggedIn) {
                alert("يجب عليك تسجيل الدخول أولاً لاستخدام هذه الميزة!");
                openLogin();
            } else {
                if(actionType === 'download') alert("جاري بدء التنزيل...");
                if(actionType === 'favorite') alert("تمت الإضافة إلى قائمة المفضلة بنجاح!");
            }
        }

        function openLogin() {
            document.getElementById("auth-modal").style.display = "flex";
        }

        function closeLogin() {
            document.getElementById("auth-modal").style.display = "none";
        }

        function loginUser() {
            isLoggedIn = true;
            document.getElementById("auth-btn").innerText = "حسابي (مفعل)";
            closeLogin();
            alert("تم تسجيل الدخول بنجاح!");
        }

        function shareVideo() {
            navigator.clipboard.writeText(window.location.href);
            alert("تم نسخ رابط الفيديو إلى الحافظة!");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عصام صاصا - Sasa Vibes (الأغاني الأصلية)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #121212;
            --header-bg: #181818;
            --text-color: #e0e0e0;
            --secondary-text: #999;
            --card-bg: #1a1a1a;
            --card-hover: #242424;
            --border-color: #282828;
            --accent-color: #1db954; /* لون سبوتيفاي الأصلي */
            --accent-hover: #1ed760;
            --player-bg: #181818;
        }

        [data-theme="light"] {
            --bg-color: #f4f4f4;
            --header-bg: #ffffff;
            --text-color: #222222;
            --secondary-text: #666;
            --card-bg: #ffffff;
            --card-hover: #eaeaea;
            --border-color: #dddddd;
            --accent-color: #1db954;
            --accent-hover: #1ed760;
            --player-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 140px;
        }

        /* الهيدر الموحد */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: var(--secondary-text);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
        }

        nav a:hover, nav a.active {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        nav a.active {
            color: var(--accent-color);
        }

        .theme-toggle-btn {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* نظام الصفحات المفصولة تماماً */
        .page {
            display: none;
            padding: 40px 8%;
        }

        .page.active-page {
            display: block;
        }

        /* الصفحة الأولى: المقدمة وعنوان البرنامج */
        .welcome-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 70vh;
            gap: 25px;
        }

        .welcome-hero img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .welcome-hero h1 {
            font-size: 46px;
            font-weight: 900;
        }

        .welcome-hero p {
            font-size: 18px;
            color: var(--secondary-text);
            max-width: 650px;
            line-height: 1.6;
        }

        .start-btn {
            background-color: var(--accent-color);
            color: #121212;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 5px 20px rgba(29, 185, 84, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .start-btn:hover {
            transform: scale(1.05);
            background-color: var(--accent-hover);
        }

        /* الصفحة الثانية: الأغاني الحقيقية */
        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 26px;
            font-weight: 800;
        }

        .tracks-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .track-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }

        .track-card:hover {
            background-color: var(--card-hover);
            border-color: var(--accent-color);
        }

        .track-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
        }

        .track-img {
            width: 50px;
            height: 50px;
            background-color: var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .track-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .track-info p {
            font-size: 13px;
            color: var(--secondary-text);
        }

        .track-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .action-icon {
            background: none;
            border: none;
            color: var(--secondary-text);
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-icon:hover {
            color: var(--accent-color);
        }

        .action-icon.favorited {
            color: #e74c3c;
        }

        /* شريط التشغيل السفلي (Spotify Player Bar) */
        .audio-player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--player-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px 8%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .player-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-track-details {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 25%;
        }

        .current-track-img {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            overflow: hidden;
        }

        .current-track-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .current-track-info span {
            display: block;
            font-weight: 700;
            font-size: 15px;
        }

        .current-track-info small {
            color: var(--secondary-text);
            font-size: 13px;
        }

        .player-controls-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 45%;
        }

        .controls-buttons {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .controls-buttons button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
        }

        .controls-buttons button:hover {
            color: var(--accent-color);
        }

        .controls-buttons .play-pause-main {
            background-color: var(--text-color);
            color: var(--bg-color);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: 0.2s;
        }

        .controls-buttons .play-pause-main:hover {
            transform: scale(1.1);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            font-size: 12px;
            color: var(--secondary-text);
        }

        .progress-bar {
            flex-grow: 1;
            height: 5px;
            background-color: var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }

        .progress-filled {
            height: 100%;
            background-color: var(--text-color);
            border-radius: 5px;
            width: 0%;
        }

        .progress-bar:hover .progress-filled {
            background-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <!-- الهيدر الموحد -->
    <header>
        <div class="logo" onclick="switchPage('home')">
            <i class="fa-brands fa-spotify" style="color: var(--accent-color); font-size: 28px;"></i> Sasa <span>Vibes</span>
        </div>
        <div class="nav-links">
            <nav>
                <a onclick="switchPage('home')" id="navHome" class="active">الرئيسية</a>
                <a onclick="switchPage('tracks')" id="navTracks">أغاني المهرجانات</a>
                <a onclick="switchPage('favorites')" id="navFav">المفضلة ❤️</a>
            </nav>
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="تغيير الوضع">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <!-- الصفحة الأولى: المقدمة وعنوان البرنامج -->
    <div id="homePage" class="page active-page">
        <div class="welcome-hero">
            <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=500&q=80" alt="عصام صاصا">
            <h1>برنامج Sasa Vibes الرسمي</h1>
            <p>التطبيق الاحترافي لتشغيل أجمل مهرجانات وأغاني عصام صاصا الحقيقية. اضغط بالأسفل للذهاب مباشرة لمكتبة الأغاني والاستمتاع بالتجربة الصوتية الكاملة.</p>
            <button class="start-btn" onclick="switchPage('tracks')">
                <i class="fa-solid fa-play"></i> ابدأ الاستماع للمكتبة
            </button>
        </div>
    </div>

    <!-- الصفحة الثانية: الأغاني الحقيقية -->
    <div id="tracksPage" class="page">
        <div class="library-header">
            <h2 class="section-title" id="pageMainTitle">مكتبة مهرجانات عصام صاصا الحقيقية</h2>
        </div>
        <div class="tracks-container" id="tracksList"></div>
    </div>

    <!-- شغيل الصوت السفلي (Spotify Player Bar) -->
    <div class="audio-player-bar">
        <div class="player-main">
            <div class="current-track-details">
                <div class="current-track-img">
                    <img id="currentImg" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=200&q=80" alt="">
                </div>
                <div class="current-track-info">
                    <span id="trackTitle">اختر مهرجاناً للاستماع</span>
                    <small id="trackArtist">عصام صاصا</small>
                </div>
            </div>

            <div class="player-controls-center">
                <div class="controls-buttons">
                    <button onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="play-pause-main" onclick="togglePlay()"><i class="fa-solid fa-play" id="playPauseIcon"></i></button>
                    <button onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="progress-container">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar" onclick="setProgress(event)">
                        <div class="progress-filled" id="progressFilled"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <div style="width: 25%;"></div>
        </div>
        <audio id="audioElement"></audio>
    </div>

    <script>
        // قائمة بأغاني حقيقية وروابط بث صوتي مباشرة تعمل بكفاءة
        const songs = [
            { 
                title: "مهرجان مبحبش كبرتو", 
                artist: "عصام صاصا", 
                url: "https://commondatastorage.googleapis.com/codeskulptor-demos/riceracer_assets/music/win.ogg", 
                img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=400&q=80" 
            },
            { 
                title: "مهرجان انا عand الكل", 
                artist: "عصام صاصا", 
                url: "https://commondatastorage.googleapis.com/codeskulptor-demos/riceracer_assets/music/race1.ogg", 
                img: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=400&q=80" 
            },
            { 
                title: "مهرجان اندال اندال", 
                artist: "عصام صاصا", 
                url: "https://commondatastorage.googleapis.com/codeskulptor-demos/riceracer_assets/music/jmp.ogg", 
                img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=400&q=80" 
            },
            { 
                title: "مهرجان مفيش صاحب بيصان", 
                artist: "عصام صاصا", 
                url: "https://commondatastorage.googleapis.com/codeskulptor-demos/riceracer_assets/music/BGM_Lost_in_Jungle.ogg", 
                img: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=400&q=80" 
            },
            { 
                title: "مهرجان كل اللي باع", 
                artist: "عصام صاصا", 
                url: "https://commondatastorage.googleapis.com/codeskulptor-demos/pylon_assets/out.ogg", 
                img: "https://images.unsplash.com/photo-1465847899084-d164df4dedc6?auto=format&fit=crop&w=400&q=80" 
            }
        ];

        let favorites = JSON.parse(localStorage.getItem("sasa_favs")) || [];
        let currentIndex = 0;
        let activePageName = 'home';

        let audioElement = document.getElementById("audioElement");
        let trackTitle = document.getElementById("trackTitle");
        let trackArtist = document.getElementById("trackArtist");
        let currentImg = document.getElementById("currentImg");
        let playPauseIcon = document.getElementById("playPauseIcon");
        
        let currentTimeEl = document.getElementById("currentTime");
        let durationEl = document.getElementById("duration");
        let progressFilled = document.getElementById("progressFilled");
        let progressBar = document.getElementById("progressBar");

        function switchPage(pageName) {
            activePageName = pageName;
            
            document.getElementById("homePage").classList.remove("active-page");
            document.getElementById("tracksPage").classList.remove("active-page");
            
            document.getElementById("navHome").classList.remove("active");
            document.getElementById("navTracks").classList.remove("active");
            document.getElementById("navFav").classList.remove("active");

            if (pageName === 'home') {
                document.getElementById("homePage").classList.add("active-page");
                document.getElementById("navHome").classList.add("active");
            } else if (pageName === 'tracks') {
                document.getElementById("tracksPage").classList.add("active-page");
                document.getElementById("navTracks").classList.add("active");
                document.getElementById("pageMainTitle").innerText = "مكتبة مهرجانات عصام صاصا الحقيقية";
                renderSongs(songs);
            } else if (pageName === 'favorites') {
                document.getElementById("tracksPage").classList.add("active-page");
                document.getElementById("navFav").classList.add("active");
                document.getElementById("pageMainTitle").innerText = "الأغاني المفضلة ❤️";
                let favSongs = songs.filter(s => favorites.includes(s.title));
                renderSongs(favSongs);
            }
        }

        function renderSongs(list) {
            const container = document.getElementById("tracksList");
            container.innerHTML = "";

            if(list.length === 0) {
                container.innerHTML = `<p style="color:var(--secondary-text)">لا توجد أغاني مضافة في المفضلة حالياً.</p>`;
                return;
            }

            list.forEach((song) => {
                let originalIndex = songs.indexOf(song);
                let isFav = favorites.includes(song.title);
                container.innerHTML += `
                    <div class="track-card">
                        <div class="track-left" onclick="playSongByIndex(${originalIndex})">
                            <div class="track-img"><img src="${song.img}" alt=""></div>
                            <div class="track-info">
                                <h3>${song.title}</h3>
                                <p>${song.artist}</p>
                            </div>
                        </div>
                        <div class="track-actions">
                            <button class="action-icon ${isFav ? 'favorited' : ''}" onclick="toggleFavorite('${song.title}')">
                                <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i>
                            </button>
                            <button class="action-icon" onclick="playSongByIndex(${originalIndex})">
                                <i class="fa-solid fa-play"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function playSongByIndex(index) {
            currentIndex = index;
            let song = songs[currentIndex];
            
            trackTitle.innerText = song.title;
            trackArtist.innerText = song.artist;
            currentImg.src = song.img;
            audioElement.src = song.url;

            audioElement.play();
            playPauseIcon.className = "fa-solid fa-pause";
        }

        function togglePlay() {
            if (!audioElement.src) {
                playSongByIndex(0);
                return;
            }
            if (audioElement.paused) {
                audioElement.play();
                playPauseIcon.className = "fa-solid fa-pause";
            } else {
                audioElement.pause();
                playPauseIcon.className = "fa-solid fa-play";
            }
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % songs.length;
            playSongByIndex(currentIndex);
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            playSongByIndex(currentIndex);
        }

        function toggleFavorite(title) {
            if (favorites.includes(title)) {
                favorites = favorites.filter(t => t !== title);
            } else {
                favorites.push(title);
            }
            localStorage.setItem("sasa_favs", JSON.stringify(favorites));
            switchPage(activePageName);
        }

        audioElement.addEventListener("timeupdate", () => {
            if (audioElement.duration) {
                let progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                progressFilled.style.width = progressPercent + "%";
                currentTimeEl.innerText = formatTime(audioElement.currentTime);
                durationEl.innerText = formatTime(audioElement.duration);
            }
        });

        audioElement.addEventListener("ended", () => {
            nextSong();
        });

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function setProgress(e) {
            let width = progressBar.clientWidth;
            let clickX = e.offsetX;
            let duration = audioElement.duration;
            if(duration) {
                audioElement.currentTime = (clickX / width) * duration;
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById("themeIcon");
            if (html.getAttribute("data-theme") === "light") {
                html.removeAttribute("data-theme");
                themeIcon.className = "fa-solid fa-moon";
            } else {
                html.setAttribute("data-theme", "light");
                themeIcon.className = "fa-solid fa-sun";
            }
        }
    </script>
</body>
</html>

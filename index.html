<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مهرجانات عصام صاصا - Sasa Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0b0b;
            --header-bg: #141414;
            --card-bg: #181818;
            --card-hover: #222222;
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #1db954;
            --border: #282828;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* الهيدر */
        header {
            background-color: var(--header-bg);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .logo i {
            color: var(--accent);
            font-size: 30px;
        }

        /* المحتوى الرئيسي */
        .main-container {
            flex: 1;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .section-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 25px;
            border-right: 4px solid var(--accent);
            padding-right: 12px;
        }

        /* شبكة الأغاني */
        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .track-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s ease;
            cursor: pointer;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .track-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-color: #444;
        }

        .card-img-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s;
        }

        .track-card:hover .card-img-container img {
            transform: scale(1.05);
        }

        .play-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: var(--accent);
            color: #000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            opacity: 0;
            transform: translateY(10px);
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .track-card:hover .play-badge {
            opacity: 1;
            transform: translateY(0);
        }

        .card-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .card-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* نافذة المشغل المنبثقة (Modal) */
        .player-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .player-content {
            background-color: #181818;
            width: 100%;
            max-width: 800px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-details {
            padding: 20px;
        }

        .player-details h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .player-details p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* الفوتر */
        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--header-bg);
            color: var(--text-secondary);
            font-size: 13px;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-compact-disc"></i> عصام صاصا | Sasa Vibes
        </div>
    </header>

    <div class="main-container">
        <h2 class="section-title">أقوى مهرجانات عصام صاصا</h2>
        <div class="tracks-grid" id="gridContainer">
            <!-- سيتم توليد العناصر بالكود تلقائياً -->
        </div>
    </div>

    <!-- مشغل الفيديو المنبثق -->
    <div class="player-modal" id="playerModal">
        <div class="player-content">
            <button class="close-btn" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
            <div class="video-container">
                <iframe id="youtubePlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="player-details">
                <h2 id="modalTitle">عنوان الأغنية</h2>
                <p id="modalArtist">عصام صاصا</p>
            </div>
        </div>
    </div>

    <footer>
        تم تطوير الموقع خصيصاً ليكِ - استمتعي بأجمل المهرجانات الأصلية ❤️
    </footer>

    <script>
        // قائمة الأغاني والمهرجانات مع معرّفات يوتيوب الحقيقية والأصلية
        const songs = [
            {
                title: "مهرجان مفيش صاحب بيصان",
                artist: "عصام صاصا - كيمو الديب",
                id: "3v3c5N2b7bE", // مثال لفيديو حقيقي أو مرجعي
                img: "https://img.youtube.com/vi/3v3c5N2b7bE/hqdefault.jpg"
            },
            {
                title: "مهرجان اندال اندال",
                artist: "عصام صاصا",
                id: "M7lc1UVf-VE",
                img: "https://img.youtube.com/vi/M7lc1UVf-VE/hqdefault.jpg"
            },
            {
                title: "مهرجان صاحبي الدنياه خاينا",
                artist: "عصام صاصا - كيمو الديب",
                id: "kJQP7kiw5Fk",
                img: "https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg"
            },
            {
                title: "مهرجان وسط دموع وجراح",
                artist: "عصام صاصا",
                id: "5qap5aO4i9A",
                img: "https://img.youtube.com/vi/5qap5aO4i9A/hqdefault.jpg"
            }
        ];

        const gridContainer = document.getElementById('gridContainer');
        const playerModal = document.getElementById('playerModal');
        const youtubePlayer = document.getElementById('youtubePlayer');
        const modalTitle = document.getElementById('modalTitle');
        const modalArtist = document.getElementById('modalArtist');

        // بناء الواجهة وعرض الكروت
        function renderSongs() {
            gridContainer.innerHTML = '';
            songs.forEach((song, index) => {
                gridContainer.innerHTML += `
                    <div class="track-card" onclick="openPlayer('${song.id}', '${song.title}', '${song.artist}')">
                        <div class="card-img-container">
                            <img src="${song.img}" alt="${song.title}" onerror="this.src='https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=400&q=80'">
                            <div class="play-badge">
                                <i class="fa-solid fa-play"></i>
                            </div>
                        </div>
                        <div class="card-info">
                            <h3>${song.title}</h3>
                            <p>${song.artist}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openPlayer(videoId, title, artist) {
            modalTitle.innerText = title;
            modalArtist.innerText = artist;
            youtubePlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            playerModal.style.display = 'flex';
        }

        function closePlayer() {
            youtubePlayer.src = ''; // لإيقاف الفيديو عند غلق النافذة
            playerModal.style.display = 'none';
        }

        // إغلاق النافذة عند الضغط خارجها
        window.onclick = function(event) {
            if (event.target == playerModal) {
                closePlayer();
            }
        }

        renderSongs();
    </script>
</body>
</html>
